[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dailylumen"
version = "1.72.0"
description = "每日复盘系统：结构化复盘沉淀进 SQLite 单一数据源，自动评分并做周/月分析"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]  # D2/M46：Settings 栈；不另列 python-dotenv（由 pydantic-settings 间接引入）

[project.scripts]
dailylumen = "review_tool.__main__:main"

[project.optional-dependencies]
web = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["review_tool*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# 开发期工具（ruff 仅在本地/CI 安装；不进运行时 dependencies）
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".workbuddy", "exports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501 行长由 formatter 兜底；中文注释/文案按字符宽度计行，不宜硬卡
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# 故意再导出：旧测试经 `review_tool.pipeline.keepstrong as ks` 访问这些符号，勿按 F401 清理
"review_tool/pipeline/keepstrong.py" = ["F401"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "ruff==0.17.3",
]

